<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body style="text-align: center; font-family: Arial, sans-serif;">
    <h1>Employee Registration Form</h1>
    <form action="success.html" method="GET">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your Name" required autofocus><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="abc@klh.edu.in" required><br><br>

        <label for="mobile">Mobile:</label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile no" pattern="[0-9]{10}" required><br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">SELECT</option>
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
            <option value="Ph.D">Ph.D</option>
        </select><br><br>

        Gender: 
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" required rows="3" cols="30" placeholder="Enter your address"></textarea><br><br>

        Skills Known: 
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="skills" value="JavaScript">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="php" name="skills" value="PHP">
        <label for="php">PHP</label><br><br>

        <label for="percentage">Inter Percentage:</label>
        <input type="number" id="percentage" name="percentage" min="0" max="100" required><br><br>

        <label for="photo">Upload Photo:</label>
        <input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.png"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="6" required><br><br>

        <button type="submit">Register</button>
        <button type="reset">Clear All</button>
    </form>
</body>
</html>
